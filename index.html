<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root {
    --dd-blue: #1677ff;
    --dd-blue-light: #c9e2ff;
    --border: #e5e6eb;
    --text-main: #1f2329;
    --text-sub: #8a9099;
    --bg: #f5f6f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-main);
    height: 100vh;
    overflow: hidden;
  }
  .app { display: flex; height: 100vh; }

  /* ===== 左侧编辑区 ===== */
  .editor {
    width: 400px;
    min-width: 400px;
    background: #fff;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .editor-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .editor-header h1 { font-size: 16px; font-weight: 600; }
  .editor-body { flex: 1; overflow-y: auto; padding: 16px; }

  .section { margin-bottom: 20px; }
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-sub);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-title::before {
    content: "";
    width: 3px; height: 12px;
    background: var(--dd-blue);
    border-radius: 2px;
  }
  .form-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .form-row:last-child { margin-bottom: 0; }

  input[type="text"], select, textarea {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    background: #fff;
    color: var(--text-main);
    transition: border-color .15s;
  }
  input[type="text"]:focus, select:focus, textarea:focus { border-color: var(--dd-blue); }
  input[type="text"] { flex: 1; min-width: 0; }
  select { cursor: pointer; }
  textarea { width: 100%; resize: vertical; min-height: 56px; }

  .btn {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text-main);
    transition: all .15s;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--dd-blue); color: var(--dd-blue); }
  .btn-primary { background: var(--dd-blue); border-color: var(--dd-blue); color: #fff; }
  .btn-primary:hover { background: #3d8bff; color: #fff; }
  .btn-sm { padding: 4px 8px; font-size: 12px; }
  .btn-danger:hover { border-color: #f54a45; color: #f54a45; }

  .member-list { display: flex; flex-direction: column; gap: 6px; }
  .member-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  .member-item input { flex: 1; border: none; padding: 2px 4px; }
  .member-item .icon-btn { border: none; background: none; cursor: pointer; color: var(--text-sub); font-size: 14px; padding: 2px 5px; }
  .member-item .icon-btn:hover { color: #f54a45; }

  /* 消息编辑列表 */
  .msg-list { display: flex; flex-direction: column; gap: 6px; }
  .msg-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    font-size: 13px;
    background: #fff;
  }
  .msg-item-top { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .msg-item-top select { flex: 1; }
  .msg-item textarea { min-height: 40px; margin-top: 2px; }
  .msg-actions { display: flex; gap: 2px; }
  .msg-actions button {
    border: none; background: none; cursor: pointer;
    color: var(--text-sub); font-size: 13px; padding: 2px 5px; border-radius: 4px;
  }
  .msg-actions button:hover { background: #f0f1f2; color: var(--dd-blue); }
  .msg-actions button.del:hover { color: #f54a45; }
  .empty-tip { color: var(--text-sub); font-size: 12px; text-align: center; padding: 16px 0; }

  /* ===== 右侧预览区 ===== */
  .preview-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
    padding: 24px;
  }
  .preview-toolbar { margin-bottom: 16px; display: flex; gap: 10px; }
  .phone {
    width: 390px;
    background: #f0f2f5;
    border-radius: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,.12);
    overflow: hidden;
    border: 8px solid #1f2329;
    align-self: flex-start;
  }
  .phone-screen { display: flex; flex-direction: column; height: 700px; background: #fff; }
  .status-bar {
    height: 30px;
    background: var(--dd-blue);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    color: #fff;
    font-size: 11px;
    flex-shrink: 0;
  }
  .nav-bar {
    min-height: 54px;
    background: var(--dd-blue);
    color: #fff;
    display: flex;
    align-items: center;
    padding: 6px 12px;
    gap: 8px;
    flex-shrink: 0;
  }
  .nav-back { font-size: 20px; opacity: .95; cursor: default; }
  .nav-center { flex: 1; text-align: center; min-width: 0; }
  .nav-title {
    font-size: 16px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .nav-sub {
    font-size: 10px;
    color: rgba(255,255,255,.78);
    margin-top: 1px;

    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .nav-icons { display: flex; align-items: center; gap: 12px; opacity: .95; }
  .nav-icons svg { display: block; }

  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 12px 12px 16px;
    background: #f5f6f7;
  }

  /* 消息样式 */
  .sys-msg { text-align: center; margin: 10px 0; }
  .sys-msg span {
    display: inline-block;
    font-size: 11px;
    color: #fff;
    background: rgba(0,0,0,.18);
    padding: 3px 10px;
    border-radius: 4px;
  }
  .time-msg { text-align: center; margin: 12px 0; }
  .time-msg span { font-size: 11px; color: var(--text-sub); }

  .msg-row { display: flex; margin: 16px 0; gap: 8px; align-items: flex-start; }
  .msg-row.self { flex-direction: row-reverse; }
  .avatar {
    width: 40px; height: 40px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 500;
    flex-shrink: 0;
    user-select: none;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .msg-body { max-width: 250px; display: flex; flex-direction: column; }
  .msg-row.self .msg-body { align-items: flex-end; }
  .sender-name {
    font-size: 12px;
    color: #9aa0a8;
    margin-bottom: 4px;
    padding-left: 2px;
  }
  .bubble {
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1.5;
    word-break: break-word;
    white-space: pre-wrap;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .msg-row.self .bubble { background: var(--dd-blue-light); }
  .read-receipt {
    font-size: 11px;
    color: #9aa0a8;
    margin-top: 3px;
    padding-right: 2px;
  }

  /* 底部功能区：群签到 / 输入框 / 工具栏 */
  .chat-footer {
    flex-shrink: 0;
    background: #f5f6f7;
    padding: 8px 12px 4px;
  }
  .footer-actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: none;
    border-radius: 16px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--text-main);
    background: #fff;
  }
  .input-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .input-pill {
    flex: 1;
    background: #fff;
    border-radius: 18px;
    padding: 9px 14px;
    font-size: 13px;
    color: #9aa0a8;
  }
  .toolbar-row { display: flex; justify-content: space-between; padding: 2px 4px; }
  .tool {
    min-width: 30px; height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #5b6067;
    font-size: 15px;
    font-weight: 500;
  }
  .export-area { display: none; position: fixed; left: -9999px; top: 0; }
  #exportNode .chat-area { height: auto; overflow: visible; }

  /* toast */
  .toast {
    position: fixed;
    top: 24px; left: 50%;
    transform: translateX(-50%);
    background: rgba(31,35,41,.9);
    color: #fff;
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; }
</style>
</head>

<script>
  // 头像统一使用钉钉蓝：浅蓝底 + 蓝色文字
  const DD_BLUE = '#1677ff';
  const DD_BLUE_LIGHT = '#e8f3ff';
  let memberSeq = 0;

  let state = {
    myAvatar: '',
    members: [
      { id: 1, name: '沈楪（数据安全委员）', avatar: '' },
      { id: 2, name: '老譚', avatar: '' },
      { id: 3, name: '林昌志', avatar: '' },
    ],
    messages: [
      { type: 'chat', self: true, text: 'OpenCode' },
      { type: 'chat', senderId: 1, text: '那模型是哪个？' },
      { type: 'chat', senderId: 2, text: '如果需要充值token可以让财务执行' },
      { type: 'chat', senderId: 2, text: '这个事情非常重要，有可能是未来公司流量的重要来源' },
      { type: 'chat', self: true, text: '干问' },
      { type: 'chat', senderId: 3, text: 'deepseek' },
    ],
  };

  /* ===== 本地持久化：刷新页面后数据仍在 ===== */
  const STORAGE_KEY = 'dingtalk-chat-simulator-v1';

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        chatTitle: document.getElementById('chatTitle').value,
        navSubtitle: document.getElementById('navSubtitle').value,
        showRead: document.getElementById('showRead').checked,
        myName: document.getElementById('myName').value,
        myAvatar: state.myAvatar,
        members: state.members,
        messages: state.messages,
      }));
    } catch (e) {
      // 存储不可用或空间不足时静默失败，不影响正常使用
    }
  }

  function loadState() {
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { return; }
    if (!raw) return;
    let d;
    try { d = JSON.parse(raw); } catch (e) { return; }
    if (Array.isArray(d.members)) state.members = d.members;
    if (Array.isArray(d.messages)) state.messages = d.messages;
    state.myAvatar = d.myAvatar || '';
    if (typeof d.chatTitle === 'string') document.getElementById('chatTitle').value = d.chatTitle;
    if (typeof d.navSubtitle === 'string') document.getElementById('navSubtitle').value = d.navSubtitle;
    if (typeof d.showRead === 'boolean') document.getElementById('showRead').checked = d.showRead;
    if (typeof d.myName === 'string') document.getElementById('myName').value = d.myName;
  }

  function getMember(id) { return state.members.find(m => m.id === id); }
  function senderOptions() {
    let html = state.members.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
    html += `<option value="__self">${escapeHtml(document.getElementById('myName').value) || '我'}（我）</option>`;
    return html;
  }

  function escapeHtml(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escapeAttr(s) { return escapeHtml(s).replace(/\n/g, '&#10;'); }

  /* ===== 头像渲染：图片头像显示为圆形，文字头像为钉钉浅蓝圆角方形 ===== */
  function avatarHTML(opts, size) {
    const s = size || 40;
    if (opts.avatar) {
      return `<div class="avatar" style="width:${s}px;height:${s}px;border-radius:50%"><img src="${opts.avatar}" alt=""></div>`;
    }
    const text = escapeHtml((opts.name || '?').slice(0, 2));
    const fontSize = s <= 22 ? 10 : 13;
    return `<div class="avatar" style="width:${s}px;height:${s}px;background:${DD_BLUE_LIGHT};color:${DD_BLUE};font-size:${fontSize}px">${text}</div>`;
  }

  /* ===== 渲染：成员编辑 ===== */
  function renderMembers() {
    const box = document.getElementById('memberList');
    box.innerHTML = state.members.map(m => `
      <div class="member-item">
        <span style="line-height:0">${avatarHTML(m, 22)}</span>
        <input type="text" value="${escapeAttr(m.name)}" oninput="renameMember(${m.id}, this.value)">
        <button class="icon-btn" title="${m.avatar ? '更换头像' : '上传头像'}" onclick="pickAvatar(${m.id})">&#128247;</button>
        ${m.avatar ? `<button class="icon-btn" title="清除头像，恢复文字头像" onclick="clearAvatar(${m.id})">&#8634;</button>` : ''}
        <button class="icon-btn" title="删除成员" onclick="removeMember(${m.id})">&#10005;</button>
      </div>
    `).join('') || '<div class="empty-tip">暂无成员，点击下方按钮添加</div>';
  }

  /* ===== 渲染：消息编辑列表 ===== */
  function renderMsgList() {
    const box = document.getElementById('msgList');
    if (!state.messages.length) {
      box.innerHTML = '<div class="empty-tip">还没有消息，在上方添加</div>';
      return;
    }
    box.innerHTML = state.messages.map((msg, i) => {
      let senderSel = '';
      if (msg.type === 'chat') {
        senderSel = `<select onchange="changeSender(${i}, this.value)">${senderOptions().replace(
          `value="${msg.self ? '__self' : msg.senderId}"`,
          `value="${msg.self ? '__self' : msg.senderId}" selected`
        )}</select>`;
      } else {
        senderSel = `<select disabled><option>${msg.type === 'time' ? '时间分割' : '系统消息'}</option></select>`;
      }
      const content = msg.type === 'chat'
        ? `<textarea oninput="changeContent(${i}, this.value)" placeholder="消息内容">${escapeHtml(msg.text)}</textarea>`
        : `<input type="text" style="width:100%" value="${escapeAttr(msg.text)}" oninput="changeContent(${i}, this.value)" placeholder="${msg.type === 'time' ? '如：今天 09:30' : '如：xxx 加入群聊'}">`;
      return `
      <div class="msg-item">
        <div class="msg-item-top">
          ${senderSel}
          <div class="msg-actions">
            <button title="上移" onclick="moveMsg(${i},-1)">&#8593;</button>
            <button title="下移" onclick="moveMsg(${i},1)">&#8595;</button>
            <button class="del" title="删除" onclick="removeMsg(${i})">&#10005;</button>
          </div>
        </div>
        ${content}
      </div>`;
    }).join('');
  }

  /* ===== 渲染：聊天预览（按钉钉真实样式：对方消息上方灰色昵称，自己消息下方"全部已读"） ===== */
  function renderChat(targetId) {
    const myName = document.getElementById('myName').value.trim() || '我';
    const showRead = document.getElementById('showRead').checked;
    const area = document.getElementById(targetId);
    let html = '';

    state.messages.forEach(msg => {
      if (msg.type === 'time') {
        html += `<div class="time-msg"><span>${escapeHtml(msg.text)}</span></div>`;
      } else if (msg.type === 'sys') {
        html += `<div class="sys-msg"><span>${escapeHtml(msg.text)}</span></div>`;
      } else {
        if (msg.self) {
          html += `
          <div class="msg-row self">
            ${avatarHTML({ name: myName, avatar: state.myAvatar })}
            <div class="msg-body">
              <div class="bubble">${escapeHtml(msg.text)}</div>
              ${showRead ? '<div class="read-receipt">全部已读</div>' : ''}
            </div>
          </div>`;
        } else {
          const m = getMember(msg.senderId) || { name: '?', avatar: '' };
          html += `
          <div class="msg-row">
            ${avatarHTML(m)}
            <div class="msg-body">
              <div class="sender-name">${escapeHtml(m.name)}</div>
              <div class="bubble">${escapeHtml(msg.text)}</div>
            </div>
          </div>`;
        }
      }
    });
    area.innerHTML = html;
  }

  function render() {
    renderMembers();
    renderMsgList();
    renderChat('chatArea');
    document.getElementById('navTitle').textContent = document.getElementById('chatTitle').value || '聊天';
    document.getElementById('navSubText').textContent = document.getElementById('navSubtitle').value || '';
    // 刷新"我的头像"预览
    document.getElementById('myAvatarPreview').innerHTML =
      avatarHTML({ name: document.getElementById('myName').value.trim() || '我', avatar: state.myAvatar }, 28);
    // 刷新新消息下拉框（保留当前选择）
    const sel = document.getElementById('newSender');
    const prev = sel.value || '__self';
    sel.innerHTML = senderOptions();
    sel.value = prev;
    saveState();
  }

  /* ===== 头像上传 ===== */
  let uploadingTarget = null; // 'self' 或成员 id
  function pickAvatar(target) {
    uploadingTarget = target;
    document.getElementById('avatarFileInput').click();
  }
  // 头像统一压缩为 96×96 正方形，体积小、便于本地持久化
  const AVATAR_SIZE = 96;
  function onAvatarFile(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    if (!/^image\//.test(file.type)) { toast('请选择图片文件'); input.value = ''; return; }
    if (file.size > 10 * 1024 * 1024) { toast('图片请小于 10MB'); input.value = ''; return; }
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let dataUrl = e.target.result;
        try {
          const canvas = document.createElement('canvas');
          canvas.width = AVATAR_SIZE; canvas.height = AVATAR_SIZE;
          const ctx = canvas.getContext('2d');
          // 居中裁剪为正方形后缩放
          const side = Math.min(img.width, img.height);
          ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, AVATAR_SIZE, AVATAR_SIZE);
          dataUrl = canvas.toDataURL('image/jpeg', 0.92);
        } catch (err) {
          // 压缩失败时使用原图
        }
        if (uploadingTarget === 'self') {
          state.myAvatar = dataUrl;
        } else {
          const m = getMember(uploadingTarget);
          if (m) m.avatar = dataUrl;
        }
        uploadingTarget = null;
        input.value = '';
        render();
        toast('头像已更新');
      };
      img.onerror = () => { toast('图片读取失败'); input.value = ''; };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
  function clearAvatar(target) {
    if (target === 'self') { state.myAvatar = ''; }
    else { const m = getMember(target); if (m) m.avatar = ''; }
    render();
  }

  /* ===== 成员操作 ===== */
  function addMember() {
    memberSeq++;
    state.members.push({
      id: Date.now() + memberSeq,
      name: '成员' + (state.members.length + 1),
      avatar: '',
    });
    render();
  }
  function removeMember(id) {
    state.members = state.members.filter(m => m.id !== id);
    render();
  }
  function renameMember(id, name) {
    const m = getMember(id); if (m) m.name = name;
    // 只刷新依赖名字的区域；不能重建成员列表，否则输入框丢失焦点无法打字
    renderMsgList();
    renderChat('chatArea');
    const sel = document.getElementById('newSender');
    const prev = sel.value || '__self';
    sel.innerHTML = senderOptions();
    sel.value = prev;
  }
  /* ===== 消息操作 ===== */  function addMessage() {
    const sel = document.getElementById('newSender');
    const content = document.getElementById('newContent').value.trim();
    if (!content) { toast('请输入消息内容'); return; }
    const msg = sel.value === '__self'
      ? { type: 'chat', self: true, text: content }
      : { type: 'chat', senderId: Number(sel.value), text: content };
    state.messages.push(msg);
    document.getElementById('newContent').value = '';
    render();
    scrollChatBottom();
  }
  function addTimeDivider() {
    state.messages.push({ type: 'time', text: '今天 ' + nowHM() });
    render(); scrollChatBottom();
  }
  function addSystemMsg() {
    state.messages.push({ type: 'sys', text: 'xxx 加入群聊' });
    render(); scrollChatBottom();
  }
  function changeSender(i, v) {
    const msg = state.messages[i];
    if (v === '__self') { msg.self = true; delete msg.senderId; }
    else { msg.self = false; msg.senderId = Number(v); }
    render();
  }
  function changeContent(i, v) { state.messages[i].text = v; renderChat('chatArea'); }
  function moveMsg(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= state.messages.length) return;
    [state.messages[i], state.messages[j]] = [state.messages[j], state.messages[i]];
    render(); scrollChatBottom();
  }
  function removeMsg(i) { state.messages.splice(i, 1); render(); }

  function resetAll() {
    if (!confirm('确定清空所有成员和消息吗？')) return;
    state.members = []; state.messages = []; state.myAvatar = '';
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    render();
  }

  /* ===== 导出长图 ===== */
  async function exportPNG() {
    if (typeof html2canvas === 'undefined') { toast('html2canvas 加载失败，请检查网络或直接截图'); return; }
    renderChat('exportNode');
    // 导出节点补齐状态栏与导航栏
    const node = document.getElementById('exportNode');
    if (!node.querySelector('.status-bar')) {
      node.insertAdjacentHTML('afterbegin', document.getElementById('phoneScreen').querySelector('.status-bar').outerHTML + document.getElementById('phoneScreen').querySelector('.nav-bar').outerHTML);
    }
    try {
      const canvas = await html2canvas(node, { scale: 2, backgroundColor: '#f5f6f7' });
      const a = document.createElement('a');
      a.download = 'dingtalk-chat-' + Date.now() + '.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      toast('长图已导出');
    } catch (e) {
      toast('导出失败：' + e.message);
    }
  }

  /* ===== 工具 ===== */
  function nowHM() {
    const d = new Date();
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  function scrollChatBottom() {
    const area = document.getElementById('chatArea');
    area.scrollTop = area.scrollHeight;
  }
  let toastTimer;
  function toast(text) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }
  document.getElementById('clock').textContent = nowHM();

  // 恢复上次的数据后再渲染
  loadState();
  render();
  scrollChatBottom();

  // 任意输入/点击后自动保存（防抖），关闭页面前再保存一次
  let saveTimer;
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveState, 300);
  }
  document.addEventListener('input', scheduleSave, true);
  document.addEventListener('change', scheduleSave, true);
  document.addEventListener('click', scheduleSave, true);
  window.addEventListener('beforeunload', saveState);
</script>
</body>
</html>
